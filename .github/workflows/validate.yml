name: Validate skills

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate skills, references, evals, and packs
        run: ./scripts/validate-skills.sh
      - name: Build skill zips and packs (must succeed)
        run: ./scripts/build-packs.sh
